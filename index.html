        // Execute Tasks Engine
        async function executeTask(task) {
            termStatus.innerText = `[Running Task Line ${task.lineIndex + 1}]`;
            termStatus.className = 'text-yellow-400 font-bold';

            logTerminal(`Executing line ${task.lineIndex + 1}: "${task.content}"`, 'info');

            if (task.type === 'ai') {
                if (!aiEnabled) {
                    logTerminal(`AI disabled in settings. Skipping Gemini call and running offline: "${task.content}"`, 'warn');
                } else {
                    await handleAITask(task);
                }
            } else if (task.type === 'webhook') {
                await handleWebhookTask(task);
            } else if (task.type === 'clean') {
                logTerminal(`Triggered local cleanup routine for active note buffer...`, 'success');
            } else if (task.type === 'build') {
                logTerminal(`[BUILD RUNNER] Simulating build pipeline execution: ${task.content.replace('@build', '')}`, 'success');
            } else {
                logTerminal(`Task completed: ${task.content}`, 'success');
            }

            // Mark task checkbox as completed in markdown text
            markTaskComplete(task.lineIndex);

            termStatus.innerText = '[Idle]';
            termStatus.className = 'text-npp-dim';
        }
